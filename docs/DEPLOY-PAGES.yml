# ═══════════════════════════════════════════════════════════════════════════
# Series Hub → GitHub Pages auto-deploy
#
# ➜ PLACE THIS FILE AT:  .github/workflows/deploy.yml
#    (GitHub web UI: Add file → create new file → name it
#     .github/workflows/deploy.yml → paste everything below → Commit)
#    See docs/DEPLOY.md for the 3-step go-live guide.
# ═══════════════════════════════════════════════════════════════════════════
name: Deploy Series Hub → GitHub Pages

on:
  push:
    branches: [main, arena/019fc775-series-hub]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # gate: never deploy a broken build
      - run: npm run check:data
      - run: npm run check:ssr
      - run: npm run build
        env:
          VITE_BASE: /series-hub/
          # optional — live auth/sync when these repo secrets exist
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_STREAM_API_URL: ${{ secrets.VITE_STREAM_API_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Guard the one setting this pipeline cannot set itself:
      # Settings → Pages → Source must be "GitHub Actions" (docs/DEPLOY.md step 2).
      # With "Deploy from a branch", the site serves RAW REPO FILES — index.html
      # points at /src/main.jsx and the JS never runs, so visitors see the boot
      # animation forever. Fail loudly instead of shipping a broken page.
      - name: Verify the live site serves the built app
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for i in 1 2 3 4 5; do
            html="$(curl -fsSL --max-time 30 "$url" || true)"
            if printf '%s' "$html" | grep -q '/src/main.jsx'; then
              echo "::error title=Pages publishing raw source::The live site serves the repo's raw index.html (script src=/src/main.jsx → 404/JSX), so visitors are stuck on the boot animation. Fix: Settings → Pages → Source → 'GitHub Actions' — see docs/DEPLOY.md step 2. Then re-run this workflow."
              exit 1
            fi
            if printf '%s' "$html" | grep -q '/assets/'; then
              echo "OK — the built app is live (built assets are referenced)."
              exit 0
            fi
            echo "Attempt $i: deployment not propagated yet, retrying in 15s…"
            sleep 15
          done
          echo "::error title=Deploy check failed::The live page at $url did not reference built assets in time. Check Settings → Pages and the workflow logs."
          exit 1
