<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305060a'/%3E%3Ctext x='6' y='45' font-family='Arial Black, Arial' font-size='30' font-weight='900' fill='%23e50914'%3ES%3C/text%3E%3Ctext x='28' y='45' font-family='Arial Black, Arial' font-size='30' font-weight='900' fill='%232e93ff'%3EH%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Series Hub — watch series & films online. Unlimited streaming in blue, black and red." />
    <meta name="theme-color" content="#05060a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Series Hub" />
    <title>Series Hub — Watch TV Shows Online, Watch Films Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { background:#05060a; margin:0; min-height:100vh; }
      #root { min-height:100vh; background:#05060a; }
      /* Static boot splash — shows instantly before JS loads, guaranteeing landing on boot */
      .boot-static {
        position: fixed; inset: 0; z-index: 1000;
        background: #000;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
      }
      .boot-static .boot-rays {
        position: absolute; left: 50%; top: 50%;
        width: 220vmax; height: 220vmax;
        transform: translate(-50%, -50%);
        background: repeating-conic-gradient(from 0deg,
          transparent 0deg 13deg,
          rgba(46, 147, 255, .13) 13deg 19deg,
          transparent 19deg 34deg,
          rgba(229, 9, 20, .11) 34deg 39deg,
          transparent 39deg 58deg);
        animation: kf-spin 26s linear infinite, kf-rays-in 1.6s .35s ease-out forwards;
        -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%);
        mask-image: radial-gradient(circle, #000 0%, transparent 62%);
        opacity: 0;
      }
      .boot-static .boot-logo {
        position: relative; z-index: 3;
        font-size: clamp(3.4rem, 14vw, 13rem);
        letter-spacing: .05em; display: flex; align-items: baseline;
        filter: drop-shadow(0 0 34px rgba(46, 147, 255, .22)) drop-shadow(0 6px 26px rgba(0, 0, 0, .8));
      }
      .boot-static .boot-logo .r {
        background-image: linear-gradient(178deg, #ff4b55 6%, #e50914 55%, #8f040d 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
        display: inline-block; animation: kf-bletter .62s cubic-bezier(.16, .84, .3, 1.16) forwards;
      }
      .boot-static .boot-logo .b {
        background-image: linear-gradient(178deg, #7cc0ff 6%, #2e93ff 55%, #0b3d91 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
        display: inline-block; animation: kf-bletter .62s cubic-bezier(.16, .84, .3, 1.16) forwards;
      }
      .boot-static .boot-logo .boot-gap { width: .32em; }
      .boot-static .boot-tag {
        position: absolute; z-index: 3;
        top: calc(50% + clamp(2.6rem, 8vw, 7.4rem));
        display: flex; gap: 1.1em; align-items: center;
        font-family: Inter, Arial, sans-serif;
        font-size: clamp(.62rem, 1.05vw, .95rem);
        font-weight: 600; letter-spacing: .5em; color: #93a1b8;
        opacity: 0; animation: kf-fade .9s 1.55s forwards;
      }
      .boot-static .boot-tag i { width: 4px; height: 4px; border-radius: 50%; background: #2e93ff; box-shadow: 0 0 8px #2e93ff; }
      @keyframes kf-bletter { 0% { opacity: 0; transform: translateY(.32em) scale(2.4); filter: blur(14px); } 55% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes kf-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
      @keyframes kf-rays-in { to { opacity: 1; } }
      @keyframes kf-fade { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05060a;color:#fff;font-family:Inter,sans-serif;padding:2rem;text-align:center">
        <div><h1 style="font-size:1.4rem;margin-bottom:.6rem">JavaScript required</h1><p style="color:#b3b3b3">Series Hub needs JavaScript to run. Please enable it in your browser settings.</p></div>
      </div>
    </noscript>
    <div id="root">
      <!-- Static boot splash: first paint is boot animation, before any JS -->
      <div class="boot-static" aria-label="Series Hub boot">
        <div class="boot-rays" aria-hidden="true"></div>
        <div class="boot-logo" aria-label="Series Hub">
          <span class="r" style="animation-delay:0ms">S</span><span class="r" style="animation-delay:60ms">E</span><span class="r" style="animation-delay:120ms">R</span><span class="r" style="animation-delay:180ms">I</span><span class="r" style="animation-delay:240ms">E</span><span class="r" style="animation-delay:300ms">S</span>
          <span class="boot-gap" aria-hidden="true"></span>
          <span class="b" style="animation-delay:0ms">H</span><span class="b" style="animation-delay:60ms">U</span><span class="b" style="animation-delay:120ms">B</span>
        </div>
        <div class="boot-tag"><span>SERIES</span><i></i><span>FILMS</span><i></i><span>UNLIMITED</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Boot watchdog — the splash above is static HTML, visible before any JS.
      // If the app bundle never runs (deployment serving raw source instead of
      // the built app, blocked script, stale cache, ancient browser without ES
      // modules), swap the endless splash for a clear error + recovery instead.
      // main.jsx sets window.__shBooted as soon as React mounts.
      (function () {
        function watch () {
          setTimeout(function () {
            var el = document.querySelector('.boot-static')
            if (!el) return // React mounted and cleaned the splash — all good
            if (window.__shBooted) { try { el.remove() } catch (e) {} return }
            el.innerHTML =
              '<div style="max-width:560px;padding:2rem;text-align:center;font-family:Inter,Arial,sans-serif;color:#fff">' +
                '<div style="font-size:1.35rem;font-weight:800;margin:0 0 .8rem">Series Hub couldn’t finish loading</div>' +
                '<p style="color:#b3b3b3;font-size:.95rem;margin:0 0 1.4rem">The page loaded, but the app script didn’t. Check your connection and reload. If it continues, clear site data for this origin and try again.</p>' +
                '<button onclick="location.reload()" style="background:#fff;color:#05060a;border:0;border-radius:6px;padding:.65em 1.6em;font-weight:700;font-size:.95rem;cursor:pointer">Reload</button>' +
                '<p style="color:#5c6b84;font-size:.75rem;margin:1.6rem 0 0;line-height:1.5">Site owner: if this is the GitHub Pages deployment, the site is publishing <b>raw source</b> instead of the built app — set Settings → Pages → Source to “GitHub Actions” (docs/DEPLOY.md, step 2).</p>' +
              '</div>'
          }, 9000)
        }
        if (document.readyState === 'complete') watch()
        else window.addEventListener('load', watch)
      })()
    </script>
  </body>
</html>
